name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked --dev
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
