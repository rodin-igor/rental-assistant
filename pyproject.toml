[project]
name = "rental-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.0",
    "pydantic-ai-slim[openai]>=2.59.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff.lint]
extend-select = ["C90"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.mypy]
files = ["app"]
plugins = ["pydantic.mypy"]